name: Tests

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Release this branch'
        required: false
        type: boolean
  release:
    types: [created]
  pull_request:
  push:
    branches:
      - master

jobs:
  test_manylinux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64  # Need a relatively modern platform for the actions to work
    strategy:
      fail-fast: false
      matrix:
        python-version: [cp310-cp310, cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        run: |
          echo "/opt/python/${{ matrix.python-version }}/bin" >> $GITHUB_PATH
          echo $PATH
      - name: Install dependencies
        run: pip install tox==4.64.5 tox-gh==1.8.0 auditwheel==6.8.2
      - name: Test wheel with tox
        run: python -m tox
      - name: Audit wheel
        run: auditwheel repair .tox/.pkg/dist/*.whl -w audited_wheels
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.job }}-${{ strategy.job-index }}
          path: audited_wheels/*

  test_alpine:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - "python:3.10-alpine"
          - "python:3.11-alpine"
          - "python:3.12-alpine"
          - "python:3.13-alpine"
          - "python:3.14-alpine"
    steps:
      - name: Install packages
        # gcc and musl-dev needed for compiling the package
        # git needed for checkout
        # patchelf needed for auditwheel
        run: apk add gcc musl-dev git patchelf
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install tox==4.64.5 tox-gh==1.8.0 auditwheel==6.8.2
      - name: Test wheel with tox
        run: python -m tox
      - name: Audit wheel
        run: auditwheel repair .tox/.pkg/dist/*.whl -w audited_wheels
      - name: Upload dists
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.job }}-${{ strategy.job-index }}
          path: audited_wheels/*

  test_windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        arch: [ x86, x64 ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}
          allow-prereleases: true
      - name: Install dependencies
        run: python -m pip install tox==4.64.5 tox-gh==1.8.0
      - name: Test with tox
        run: python -m tox
      - name: Upload dists
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.job }}-${{ strategy.job-index }}
          path: .tox/.pkg/dist/*

  test_mac:
    runs-on: macos-13
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: sudo python -m pip install tox==4.64.5 tox-gh==1.8.0
      - name: Test with tox
        run: sudo -E python -m tox -e sdist

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install tox==4.64.5 tox-gh==1.8.0
      - name: Build and test the sdist
        run: python -m tox -e sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: .tox/.pkg/dist/*.tar.gz

  publish:
    if: (github.event_name == 'release' && github.event.action == 'created') || inputs.deploy
    needs: [test_manylinux, test_alpine, test_windows, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python -m pip install twine
          python -m twine check dist/*
          python -m twine upload --skip-existing dist/*
